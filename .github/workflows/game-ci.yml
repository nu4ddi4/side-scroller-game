name: Godot Windows

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional stable release tag (for example v0.2.0); main only'
        required: false
        type: string
      verified_run_id:
        description: 'Recovery only: successful Godot Windows run with identical shipped game inputs; reuse its Windows-tested artifacts'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: game-${{ github.workflow }}-${{ github.ref }}-${{ inputs.verified_run_id || 'build' }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce feature to beta, beta to main
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then exit 0; fi
          if [[ "$BASE" == main && "$HEAD" != beta ]]; then
            echo 'main accepts pull requests only from beta.'
            exit 1
          fi
          if [[ "$BASE" == beta && ! "$HEAD" =~ ^(feature|fix|chore)/.+ ]]; then
            echo 'beta accepts feature/*, fix/*, or chore/* branches.'
            exit 1
          fi

  build:
    name: Test & export Windows
    if: github.event_name != 'workflow_dispatch' || inputs.verified_run_id == ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          sudo ln -s /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          python3 tools/fetch_templates.py
      - name: Import project
        run: godot --headless --editor --import --quit
      - name: Physics and save regression tests
        run: godot --headless --fixed-fps 120 --script tests/run_tests.gd -- --test
      - name: Full stage traversal with normal inputs
        run: godot --headless --fixed-fps 120 --script tests/playthrough.gd -- --test
      - name: Update metadata, real HTTP download, verification and cancellation
        run: python3 tools/test_updater.py
      - name: Export Windows x64
        run: |
          mkdir -p build/windows
          godot --headless --export-release 'Windows Desktop' build/windows/OneMoreTry.exe
          cp docs/PLAY_WINDOWS.txt build/windows/README.txt
          mkdir -p build/windows/licenses
          cp assets/fonts/LICENSE.txt build/windows/licenses/NotoSansCJK.txt
          cp docs/GODOT_LICENSE.txt build/windows/licenses/Godot.txt
          cp docs/GODOT_COPYRIGHT.txt build/windows/licenses/Godot-third-party.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OneMoreTry-Windows-x64
          path: build/windows/
          retention-days: 30

  windows-smoke:
    name: Windows launch
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OneMoreTry-Windows-x64
          path: build/windows
      - name: Build per-user Windows installer
        shell: pwsh
        run: |
          $version = (Select-String -Path project.godot -Pattern '^config/version="([^"]+)"').Matches.Groups[1].Value
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $compiler)) { throw 'Inno Setup 6 is required on this runner' }
          & $compiler "/DAppVersion=$version" installer/OneMoreTry.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Install, reinstall, launch and uninstall with saved-record preservation
        shell: pwsh
        run: ./tools/test_installer.ps1
      - name: Launch the exported exe on native Windows
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./build/windows/OneMoreTry.exe -ArgumentList '--headless','--audio-driver','Dummy','--quit-after','120','--','--test' -PassThru -Wait -RedirectStandardOutput native-stdout.log -RedirectStandardError native-stderr.log
          Get-Content native-stdout.log
          Get-Content native-stderr.log
          if ($process.ExitCode -ne 0) { throw "Game exited with $($process.ExitCode)" }
          $errors = Select-String -Path native-stdout.log,native-stderr.log -Pattern 'SCRIPT ERROR|ERROR:'
          if ($errors) { throw "Godot reported runtime errors: $errors" }
      - uses: actions/upload-artifact@v4
        with:
          name: OneMoreTry-Windows-installer
          path: build/installer/*-Setup.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-launch-logs
          path: |
            native-*.log
            installer-*.log

  publish:
    name: Publish Windows release
    if: always() && needs.branch-policy.result == 'success' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')) && ((needs.build.result == 'success' && needs.windows-smoke.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.verified_run_id != ''))
    needs: [branch-policy, build, windows-smoke]
    runs-on: ubuntu-latest
    concurrency:
      group: windows-release-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      REQUESTED_TAG: ${{ inputs.release_tag }}
      VERIFIED_RUN_ID: ${{ inputs.verified_run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release request
        id: release
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Release only from main'; exit 1; }
          version=$(sed -n 's/^config\/version="\([^"]*\)"/\1/p' project.godot)
          release_tag=${REQUESTED_TAG:-v$version}
          [[ "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vMAJOR.MINOR.PATCH'; exit 1; }
          [[ "$release_tag" == "v$version" ]] || { echo 'Tag must match project version'; exit 1; }
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          if [[ -n "$VERIFIED_RUN_ID" ]]; then
            [[ "$VERIFIED_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'Expected a numeric verified run ID'; exit 1; }
            gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN_ID" > /tmp/verified-run.json
            # A recovery commit may change publishing automation only. Require the
            # verified commit to be an ancestor and the shipped game inputs identical.
            verified_sha=$(jq -r .head_sha /tmp/verified-run.json)
            jq -e '.name == "Godot Windows" and .path == ".github/workflows/game-ci.yml" and .status == "completed" and .conclusion == "success"' /tmp/verified-run.json
            git fetch origin "$verified_sha" --depth=1
            git diff --exit-code "$verified_sha" HEAD -- project.godot export_presets.cfg scripts scenes assets installer docs/PLAY_WINDOWS.txt docs/GODOT_LICENSE.txt docs/GODOT_COPYRIGHT.txt
            gh api "repos/$GH_REPO/compare/$verified_sha...$GITHUB_SHA" --jq .status | grep -Ex 'ahead|identical'
            gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN_ID/jobs?per_page=100" > /tmp/verified-jobs.json
            jq -e '[.jobs[] | select((.name == "Test & export Windows" or .name == "Windows launch") and .conclusion == "success")] | length == 2' /tmp/verified-jobs.json
            echo "ARTIFACT_RUN_ID=$VERIFIED_RUN_ID" >> "$GITHUB_ENV"
          else
            echo "ARTIFACT_RUN_ID=$GITHUB_RUN_ID" >> "$GITHUB_ENV"
          fi
          # A missing release is distinct from an authentication or server failure.
          gh api "repos/$GH_REPO/releases?per_page=100" > /tmp/releases.json
          if jq -e --arg tag "$release_tag" '.[] | select(.tag_name == $tag and .draft == false)' /tmp/releases.json >/dev/null; then
            echo 'Published version exists; leave it untouched.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.publish == 'true'
        with:
          name: OneMoreTry-Windows-x64
          path: package
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        if: steps.release.outputs.publish == 'true'
        with:
          name: OneMoreTry-Windows-installer
          path: release
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
      - name: Package the Windows-tested executable
        if: steps.release.outputs.publish == 'true'
        working-directory: package
        run: |
          zip -r -9 "../release/OneMoreTry-${RELEASE_TAG}-Windows-x64.zip" .
          cd ../release
          sha256sum "OneMoreTry-${RELEASE_TAG}-Windows-x64.zip" > "OneMoreTry-${RELEASE_TAG}-Windows-x64.zip.sha256"
          sha256sum "OneMoreTry-${RELEASE_TAG}-Windows-x64-Setup.exe" > "OneMoreTry-${RELEASE_TAG}-Windows-x64-Setup.exe.sha256"
      - name: Upload and publish the stable release
        if: steps.release.outputs.publish == 'true'
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG — 한 번만 더! Windows 설치 및 업데이트" --notes-file docs/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG — 한 번만 더! Windows 설치 및 업데이트" --notes-file docs/RELEASE_NOTES.md --draft
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          # The updater requires GitHub's asset digest; never publish an unusable feed.
          release_api=$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)
          gh api "$release_api" > /tmp/uploaded-release.json
          jq -e --arg name "OneMoreTry-${RELEASE_TAG}-Windows-x64-Setup.exe" '.assets[] | select(.name == $name and (.digest | test("^sha256:[0-9a-f]{64}$")))' /tmp/uploaded-release.json
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
