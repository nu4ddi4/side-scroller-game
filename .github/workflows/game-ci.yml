name: Godot Windows

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional prerelease tag (for example v0.1.0); main only'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: game-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    steps:
      - name: Enforce feature to beta, beta to main
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ "$EVENT" != pull_request ]]; then exit 0; fi
          if [[ "$BASE" == main && "$HEAD" != beta ]]; then
            echo 'main accepts pull requests only from beta.'
            exit 1
          fi
          if [[ "$BASE" == beta && ! "$HEAD" =~ ^(feature|fix|chore)/.+ ]]; then
            echo 'beta accepts feature/*, fix/*, or chore/* branches.'
            exit 1
          fi

  build:
    name: Test & export Windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6.3
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          sudo ln -s /tmp/godot/Godot_v4.6.3-stable_linux.x86_64 /usr/local/bin/godot
          python3 tools/fetch_templates.py
      - name: Import project
        run: godot --headless --editor --import --quit
      - name: Physics and save regression tests
        run: godot --headless --fixed-fps 120 --script tests/run_tests.gd -- --test
      - name: Full stage traversal with normal inputs
        run: godot --headless --fixed-fps 120 --script tests/playthrough.gd -- --test
      - name: Export Windows x64
        run: |
          mkdir -p build/windows
          godot --headless --export-release 'Windows Desktop' build/windows/OneMoreTry.exe
          cp docs/PLAY_WINDOWS.txt build/windows/README.txt
          mkdir -p build/windows/licenses
          cp assets/fonts/LICENSE.txt build/windows/licenses/NotoSansCJK.txt
          cp docs/GODOT_LICENSE.txt build/windows/licenses/Godot.txt
          cp docs/GODOT_COPYRIGHT.txt build/windows/licenses/Godot-third-party.txt
      - uses: actions/upload-artifact@v4
        with:
          name: OneMoreTry-Windows-x64
          path: build/windows/
          retention-days: 30

  windows-smoke:
    name: Windows launch
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OneMoreTry-Windows-x64
          path: game
      - name: Launch the exported exe on native Windows
        shell: pwsh
        run: |
          $process = Start-Process -FilePath ./game/OneMoreTry.exe -ArgumentList '--headless','--audio-driver','Dummy','--quit-after','120','--','--test' -PassThru -Wait -RedirectStandardOutput native-stdout.log -RedirectStandardError native-stderr.log
          Get-Content native-stdout.log
          Get-Content native-stderr.log
          if ($process.ExitCode -ne 0) { throw "Game exited with $($process.ExitCode)" }
          $errors = Select-String -Path native-stdout.log,native-stderr.log -Pattern 'SCRIPT ERROR|ERROR:'
          if ($errors) { throw "Godot reported runtime errors: $errors" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-launch-logs
          path: native-*.log

  publish:
    name: Publish Windows prerelease
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    needs: windows-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release request
        run: |
          [[ "$GITHUB_REF" == refs/heads/main ]] || { echo 'Release only from main'; exit 1; }
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected vMAJOR.MINOR.PATCH'; exit 1; }
          version=$(sed -n 's/^config\/version="\([^"]*\)"/\1/p' project.godot)
          [[ "$RELEASE_TAG" == "v$version" ]] || { echo 'Tag must match project version'; exit 1; }
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > /tmp/release-draft; then
            [[ "$(cat /tmp/release-draft)" == true ]] || { echo 'Refusing to replace an existing published release'; exit 1; }
          fi
      - uses: actions/download-artifact@v4
        with:
          name: OneMoreTry-Windows-x64
          path: package
      - name: Package the Windows-tested executable
        working-directory: package
        run: |
          zip -r -9 "../OneMoreTry-${RELEASE_TAG}-Windows-x64.zip" .
          cd ..
          sha256sum "OneMoreTry-${RELEASE_TAG}-Windows-x64.zip" > "OneMoreTry-${RELEASE_TAG}-Windows-x64.zip.sha256"
      - name: Upload and publish the prerelease
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG — 한 번만 더! Windows MVP" --notes-file docs/RELEASE_NOTES.md
          else
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "$RELEASE_TAG — 한 번만 더! Windows MVP" --notes-file docs/RELEASE_NOTES.md --prerelease --draft
          fi
          gh release upload "$RELEASE_TAG" "OneMoreTry-${RELEASE_TAG}-Windows-x64.zip" "OneMoreTry-${RELEASE_TAG}-Windows-x64.zip.sha256" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease
